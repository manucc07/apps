<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>¿Quién soy? - Cronomusic</title>

  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
  <meta name="theme-color" content="#141E30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cronomusic">

  <style>
    :root {
      --bg-dark: #0f172a;
      --accent: #38bdf8;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-border: rgba(255, 255, 255, 0.1);
      --card-back: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --card-front: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%);
      --zoom: 1;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0, transparent 50%), 
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0, transparent 50%);
      background-attachment: fixed;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
      box-sizing: border-box;
    }

    #zoom-control-header {
      background: var(--surface);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid var(--surface-border);
      user-select: none;
    }

    #zoom-control-header span {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--accent);
      margin-bottom: 2px;
      opacity: 0.8;
      text-transform: uppercase;
    }

    #zoom-control-header input {
      width: 70px;
      cursor: pointer;
      height: 12px;
    }

    @media (max-width: 480px) {
      #zoom-control-header {
        padding: 4px 8px;
        border-radius: 8px;
      }
      #zoom-control-header span {
        font-size: 7px;
      }
      #zoom-control-header input {
        width: 50px;
        height: 10px;
      }
    }

    .import-btn-header {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--accent);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      padding: 0;
    }

    .import-btn-header:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    #import-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(15px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 30000;
      opacity: 0;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    #import-modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    #import-modal {
      background: var(--bg-gradient);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px;
      border-radius: 24px;
      border: 1px solid var(--surface-border);
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transform: scale(0.9);
      transition: transform 0.3s ease;
      box-sizing: border-box;
    }

    #import-modal-overlay.active #import-modal {
      transform: scale(1);
    }

    #import-modal h2 {
      color: var(--accent);
      margin-top: 0;
      text-align: center;
    }

    .warning-box {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #f59e0b;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    #import-textarea {
      width: 100%;
      height: 200px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      color: #f1f5f9;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    .import-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-input-wrapper input[type=file] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }

    .header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
    }

    .back-btn {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      backdrop-filter: blur(8px);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin: 0 5px;
      background: linear-gradient(to right, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.05em;
      text-align: center;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(20px * var(--zoom));
      transform: scale(var(--zoom));
      transform-origin: top center;
    }

    canvas {
      width: 100%;
      max-width: calc(500px * var(--zoom));
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: calc(24px * var(--zoom));
      border: 1px solid var(--surface-border);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      background: #000;
    }

    .info-panel {
      width: 100%;
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: calc(24px * var(--zoom));
      padding: calc(15px * var(--zoom)) calc(20px * var(--zoom));
      box-sizing: border-box;
      text-align: center;
      min-height: calc(80px * var(--zoom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    #type {
      font-size: calc(0.6rem * var(--zoom));
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.4;
      margin-top: calc(-10px * var(--zoom));
      margin-bottom: calc(5px * var(--zoom));
    }

    .speed-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(5px * var(--zoom));
      margin-top: calc(5px * var(--zoom));
    }

    .speed-control span {
      font-size: calc(0.7rem * var(--zoom));
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .speed-control input {
      width: calc(150px * var(--zoom));
      accent-color: var(--accent);
    }

    #hint, #name {
      font-size: calc(1.2rem * var(--zoom));
      font-weight: 600;
      line-height: 1.4;
    }

    #name {
      color: var(--accent);
      margin-top: calc(10px * var(--zoom));
    }

    .button-group {
      display: flex;
      gap: calc(10px * var(--zoom));
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    button {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: white;
      padding: calc(12px * var(--zoom)) calc(20px * var(--zoom));
      border-radius: calc(16px * var(--zoom));
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: calc(8px * var(--zoom));
      backdrop-filter: blur(8px);
      font-size: calc(1rem * var(--zoom));
    }

    button:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(calc(-2px * var(--zoom)));
    }

    button:active {
      transform: scale(0.95);
    }

    button.primary {
      background: var(--card-back);
      border: none;
    }

    .filters {
      margin-top: calc(10px * var(--zoom));
      display: flex;
      gap: calc(8px * var(--zoom));
    }

    .filters button {
      padding: calc(8px * var(--zoom)) calc(12px * var(--zoom));
      font-size: calc(0.8rem * var(--zoom));
      opacity: 0.7;
    }

    .filters button.active {
      opacity: 1;
      background: var(--surface-border);
    }


    /* Estilos para el overlay de pausa */
    .canvas-container {
      position: relative;
      width: 100%;
      max-width: calc(500px * var(--zoom));
      aspect-ratio: 1 / 1;
    }

    #pause-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: calc(24px * var(--zoom));
      pointer-events: none;
      z-index: 10;
      animation: fadeIn 0.2s ease;
    }

    #pause-overlay svg {
      width: calc(80px * var(--zoom));
      height: calc(80px * var(--zoom));
      fill: white;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
    }

    /* Botones de navegación laterales */
    .nav-side-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: calc(50px * var(--zoom));
      height: calc(50px * var(--zoom));
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid var(--surface-border);
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: all 0.2s;
      padding: 0;
      font-size: calc(1.5rem * var(--zoom));
    }

    .nav-side-btn:hover {
      background: rgba(15, 23, 42, 0.8);
      transform: translateY(-50%) scale(1.1);
    }

    .nav-side-btn:active {
      transform: translateY(-50%) scale(0.9);
    }

    .nav-side-btn.left {
      left: calc(-25px * var(--zoom));
    }

    .nav-side-btn.right {
      right: calc(-25px * var(--zoom));
    }

    @media (max-width: 600px) {
      .nav-side-btn.left {
        left: calc(10px * var(--zoom));
      }
      .nav-side-btn.right {
        right: calc(10px * var(--zoom));
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(1.1); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 480px) {
      .header {
        padding: 10px 0;
      }
      h1 { font-size: 1.2rem; }
      .back-btn, .import-btn-header {
        padding: 6px 10px;
        font-size: 0.8rem;
        border-radius: 10px;
      }
      .import-btn-header {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }
      #hint, #name { font-size: 1.1rem; }
      .speed-control input { width: 120px; }
    }
  </style>
</head>

<body>

  <div class="header">
    <a href="/" class="back-btn">← Inicio</a>
    <h1>¿Quién soy?</h1>
    <div style="display: flex; gap: 8px; align-items: center;">
      <div id="zoom-control-header">
        <span>ZOOM</span>
        <input type="range" id="zoomRange" min="0.5" max="1.5" step="0.1" value="1">
      </div>
      <button id="import-btn-header" class="import-btn-header" onclick="openImport()" title="Importar imágenes">📥</button>
    </div>
  </div>

  <div class="game-container">
    <div class="canvas-container">
      <button id="prev-side" class="nav-side-btn left">⬅</button>
      <canvas id="canvas" width="600" height="600"></canvas>
      <div id="pause-overlay">
        <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </div>
      <button id="next-side" class="nav-side-btn right">➡</button>
    </div>
    
    <div class="info-panel">
      <div id="hint"></div>
      <div id="name"></div>
    </div>
    <div id="type"></div>

    <div class="speed-control">
      <span>Velocidad de despixelado</span>
      <input type="range" id="speedRange" min="1" max="10" step="1" value="5">
    </div>

    <div class="button-group">
      <button id="toggleHint">💡 Pista: OFF</button>
      <button id="toggleName" class="primary">✅ Revelar</button>
    </div>

    <div class="filters">
      <button onclick="filterByType('all', this)" class="active">🌍 Todos</button>
      <button onclick="filterByType('actor', this)">🎭 Actores</button>
      <button onclick="filterByType('personaje', this)">🧙 Personajes</button>
    </div>

  </div>



  <div id="import-modal-overlay" onclick="closeImport()">
    <div id="import-modal" onclick="event.stopPropagation()">
      <h2>Importar Lista de Imágenes</h2>
      <div class="warning-box">
        ⚠️ <strong>Atención:</strong> Pega tu lista de imágenes en formato JSON. Cada objeto debe tener <em>name, src, type</em> (actor o personaje) y <em>hint</em>.
      </div>
      <p style="font-size: 14px; opacity: 0.8; margin-bottom: 10px;">Formato JSON esperado:</p>
      <textarea id="import-textarea" placeholder='[
  {
    "name": "Nombre del Personaje",
    "src": "https://url-de-la-imagen.jpg",
    "type": "actor",
    "hint": "Una pista sobre quién es."
  }
]'></textarea>
      
      <div style="text-align: center; margin-bottom: 15px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;">
         <button class="primary" style="font-size: 11px; padding: 8px 12px;" onclick="loadDefaultImages()">Versión Original</button>
         <button style="background: rgba(255,255,255,0.1); color: #fff; font-size: 11px; padding: 8px 12px;" onclick="document.getElementById('import-textarea').value = '[\n  {\n    &quot;name&quot;: &quot;Leonardo DiCaprio&quot;,\n    &quot;src&quot;: &quot;https://cdn.britannica.com/65/227665-050-D74A477E/American-actor-Leonardo-DiCaprio-2016.jpg&quot;,\n    &quot;type&quot;: &quot;actor&quot;,\n    &quot;hint&quot;: &quot;Ganó su primer Oscar por interpretar a un hombre en plena supervivencia contra la naturaleza.&quot;\n  }\n]'">Cargar ejemplo</button>
      </div>
      
      <div class="import-actions">
        <button class="primary" onclick="processTextImport()">Cargar Texto</button>
        <div class="file-input-wrapper">
          <button style="background: var(--surface); color: var(--accent); border: 1px solid var(--surface-border);">Subir .txt</button>
          <input type="file" id="import-file" accept=".txt,.json" onchange="processFileImport(this)">
        </div>
        <button onclick="closeImport()" style="background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);">Cancelar</button>
      </div>
    </div>
  </div>

let images = [...ORIGINAL_IMAGES];


// ====================
// ESTADO
// ====================
let filteredImages = [...images];
let currentIndex = 0;
let pixelSize = 80;
let paused = false;
let img = new Image();
let showHint = false;
let showName = false;
let pixelationSpeed = 0.001; // Base speed

shuffleArray(filteredImages);
shuffleArray(filteredImages);

const hintDiv = document.getElementById("hint");
const nameDiv = document.getElementById("name");
const typeDiv = document.getElementById("type");

const toggleHintBtn = document.getElementById("toggleHint");
const toggleNameBtn = document.getElementById("toggleName");
const zoomRange = document.getElementById("zoomRange");
const speedRange = document.getElementById("speedRange");
const pauseOverlay = document.getElementById("pause-overlay");

let animationId;

zoomRange.oninput = (e) => {
    document.documentElement.style.setProperty('--zoom', e.target.value);
};

speedRange.oninput = (e) => {
    // Escala el valor del slider (1-10) a un multiplicador de velocidad
    // El valor por defecto 5 será ~0.001
    pixelationSpeed = e.target.value * 0.0002;
};

toggleHintBtn.onclick = () => {
    showHint = !showHint;
    toggleHintBtn.textContent = showHint ? "💡 Pista: ON" : "💡 Pista: OFF";
    updateHint();
};

toggleNameBtn.onclick = () => {
	showName = !showName;
    toggleNameBtn.textContent = showName ? "✅ Revelar" : "🔄 Ocultar";
    updateName();
};

function updateHint() {
    if (!showHint || filteredImages.length === 0) {
        hintDiv.textContent = "";
        return;
    }

    hintDiv.textContent = filteredImages[currentIndex].hint || "";
}

function updateName() {
    if (!showName || filteredImages.length === 0) {
        nameDiv.textContent = "";
        return;
    }

    nameDiv.textContent = filteredImages[currentIndex].name || "";
}

// ====================
// CARGA DE IMAGEN
// ====================
function draw() {
    if (!paused && pixelSize > 1) {
        pixelSize -= pixelSize * pixelationSpeed;
        if (pixelSize < 1) pixelSize = 1;
    }

    const w = canvas.width / pixelSize;
    const h = canvas.height / pixelSize;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, w, h);
    ctx.drawImage(canvas, 0, 0, w, h, 0, 0, canvas.width, canvas.height);

    animationId = requestAnimationFrame(draw);
	
}

function loadImage() {
    if (filteredImages.length === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hintDiv.textContent = "No hay imágenes disponibles";
        nameDiv.textContent = "";
        typeDiv.textContent = "";
        return;
    }

    img.crossOrigin = "anonymous";
    img.src = filteredImages[currentIndex].src;
    img.onload = () => {
        pixelSize = 80;  // reset del pixelSize
        paused = false;
        pauseOverlay.style.display = "none";

        // Cancelamos cualquier animación previa
        if (animationId) cancelAnimationFrame(animationId);

        draw(); // iniciamos la nueva animación
        
        showName = false;
        toggleNameBtn.textContent = "✅ Revelar";
        updateHint(); // actualizar pista
        updateName();
    };
    
    // Formatear el texto de tipo
    const type = filteredImages[currentIndex].type;
    typeDiv.textContent = type === 'actor' ? '— Actor —' : '— Personaje —';
}

// ====================
// CONTROLES
// ====================
function togglePause() {
    paused = !paused;
    pauseOverlay.style.display = paused ? "flex" : "none";
}

canvas.onclick = togglePause;
canvas.ontouchstart = (e) => {
    e.preventDefault();
    togglePause();
};

const goToNext = () => {
    currentIndex = (currentIndex + 1) % filteredImages.length;
    loadImage();
};

const goToPrev = () => {
    currentIndex = (currentIndex - 1 + filteredImages.length) % filteredImages.length;
    loadImage();
};

document.getElementById("next-side").onclick = (e) => {
    e.stopPropagation();
    goToNext();
};

document.getElementById("prev-side").onclick = (e) => {
    e.stopPropagation();
    goToPrev();
};

// ====================
// FILTROS
// ====================
function filterByType(type, btn) {
    // Actualizar estilo de botones
    if (btn) {
        const buttons = document.querySelectorAll('.filters button');
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    if (type === "all") {
        filteredImages = [...images];
    } else {
        filteredImages = images.filter(img => img.type === type);
    }
    shuffleArray(filteredImages);
    currentIndex = 0;
    loadImage();
}

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// ====================
// IMPORTAR
// ====================
function openImport() {
    document.getElementById("import-modal-overlay").classList.add("active");
}

function closeImport() {
    document.getElementById("import-modal-overlay").classList.remove("active");
}

function processTextImport() {
    const text = document.getElementById("import-textarea").value.trim();
    if (!text) {
        alert("Por favor, pega el contenido JSON en el cuadro de texto.");
        return;
    }
    try {
        const cleanText = text.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");
        const newData = JSON.parse(cleanText);
        
        if (Array.isArray(newData)) {
            if (newData.length > 0) {
                const first = newData[0];
                if (!first.name || !first.src || !first.type) {
                    throw new Error("Cada objeto debe tener al menos 'name', 'src' y 'type'.");
                }
            }
            loadNewImages(newData);
        } else {
            alert("El formato debe ser una lista [ {...}, {...} ]");
        }
    } catch (e) {
        alert("Error al procesar los datos: " + e.message);
        console.error(e);
    }
}

function processFileImport(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const content = e.target.result;
        document.getElementById("import-textarea").value = content;
        processTextImport();
    };
    reader.readAsText(file);
}

function loadNewImages(newData) {
    if (!confirm("Esto reemplazará la lista actual y reiniciará el juego. ¿Continuar?")) return;
    
    images = [...newData];
    
    // Resetear botones de filtro al original (Todos)
    const buttons = document.querySelectorAll('.filters button');
    buttons.forEach(b => b.classList.remove('active'));
    buttons[0].classList.add('active');

    filterByType('all'); // Esto recarga filteredImages y llama a loadImage()
    closeImport();
}

function loadDefaultImages() {
    loadNewImages(ORIGINAL_IMAGES);
}

// ====================
// INICIO
// ====================
loadImage();
