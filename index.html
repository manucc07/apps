<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Temazos – Edición Móvil</title>

  <!-- PWA & iOS Support -->
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Temazos">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#141E30">

  <style>
    :root {
      --zoom: 1;
      --card-w: calc(140px * var(--zoom));
      --card-h: calc(95px * var(--zoom));
      --bg-dark: #0f172a;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --accent: #38bdf8;
      --card-back: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --card-front: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%);
      --surface: rgba(255, 255, 255, 0.05);
      --surface-border: rgba(255, 255, 255, 0.1);
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0, transparent 50%), 
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0, transparent 50%);
      background-attachment: fixed;
      color: #f1f5f9;
      overflow-x: hidden;
      touch-action: pan-y;
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }

    #zoom-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      padding: 12px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid var(--surface-border);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    #board {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      gap: calc(20px * var(--zoom));
      width: 100%;
    }

    #orientation-msg {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      z-index: 10000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    @media (orientation: portrait) { #orientation-msg { display: flex; } }

    .top-controls {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    #deck, #discard {
      width: var(--card-w);
      height: var(--card-h);
      position: relative;
      transition: transform 0.2s;
    }

    #discard {
      background: var(--surface);
      border: 2px dashed var(--surface-border);
      border-radius: calc(12px * var(--zoom));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #filter-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface);
      padding: 15px;
      border-radius: 16px;
      border: 1px solid var(--surface-border);
      backdrop-filter: blur(4px);
    }

    select, button {
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    #styleFilter {
      width: 150px;
      padding: 8px;
      border-radius: 8px;
      background: #1e293b;
      color: white;
      border: 1px solid var(--surface-border);
      font-size: 12px;
    }

    .btn-main {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
    }
    .btn-main:active { transform: scale(0.95); }

    .column {
      width: 95%;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      padding: 15px;
      backdrop-filter: blur(4px);
      position: relative;
    }
    
    .column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team-color-picker {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      background-color: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .team-color-picker::-webkit-color-swatch {
      border-radius: 50%;
      border: 2px solid white;
    }
    .team-color-picker::-moz-color-swatch {
      border-radius: 50%;
      border: 2px solid white;
    }

    .column h2 { 
      margin: 0; 
      font-size: calc(16px * var(--zoom)); 
      font-weight: 700;
      color: var(--accent);
      outline: none;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.2s;
    }
    .column h2:focus {
      border-bottom-color: var(--accent);
    }

    .btn-delete-team {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lane {
      display: flex;
      justify-content: center;
      gap: calc(12px * var(--zoom));
      align-items: center;
      min-height: calc(110px * var(--zoom));
      padding: 10px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
    }

    .card {
      position: absolute;
      width: var(--card-w);
      height: var(--card-h);
      border-radius: calc(12px * var(--zoom));
      padding: calc(10px * var(--zoom));
      box-sizing: border-box;
      user-select: none;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .back { 
      background: var(--card-back); 
      border: 1px solid rgba(255,255,255,0.2);
    }
    .front { 
      background: var(--card-front); 
      text-align: center; 
      border: 1px solid rgba(255,255,255,0.2);
      color: #0f172a;
    }

    .card-year { font-size: calc(24px * var(--zoom)); font-weight: 800; line-height: 1; }
    .card-title { font-size: calc(11px * var(--zoom)); font-weight: 600; margin-top: 4px; line-height: 1.2; }
    .card-author { font-size: calc(9px * var(--zoom)); opacity: 0.8; font-weight: 500; }

    .actions {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .btn-card {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      backdrop-filter: blur(4px);
    }
    .btn-card:active { background: rgba(255, 255, 255, 0.4); }

    .placeholder {
      width: var(--card-w);
      height: var(--card-h);
      border: 2px dashed var(--accent);
      border-radius: 12px;
      flex: 0 0 auto;
      opacity: 0.5;
    }

    #add-team-btn {
      background: var(--surface);
      border: 2px dashed var(--surface-border);
      color: var(--accent);
      width: 95%;
      padding: 15px;
      border-radius: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #add-team-btn:hover { background: rgba(255,255,255,0.08); }

    /* Estilos del Popup */
    #card-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #card-popup-overlay.active {
      display: flex;
      opacity: 1;
    }

    #card-popup {
      background: var(--bg-gradient);
      padding: 30px;
      border-radius: 24px;
      border: 1px solid var(--surface-border);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #card-popup-overlay.active #card-popup {
      transform: scale(1);
    }

    .popup-card-view {
      width: calc(var(--card-w) * 1.8);
      height: calc(var(--card-h) * 1.8);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      background: var(--card-front);
      color: #0f172a;
      text-align: center;
      position: relative;
    }

    .popup-card-view.back-view {
      background: var(--card-back);
      color: white;
    }

    .btn-close-popup {
      position: absolute;
      top: -15px;
      right: -15px;
      width: 35px;
      height: 35px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    #playing-animation {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 21000;
    }

    #playing-text {
      font-size: 48px;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.8; }
      to { transform: scale(1.1); opacity: 1; }
    }

    .music-note {
      position: absolute;
      font-size: 24px;
      color: var(--accent);
      opacity: 0;
      animation: float-note 3s linear infinite;
    }

    @keyframes float-note {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(var(--tr)); opacity: 0; }
    }

  </style>
</head>

<body>

<div id="orientation-msg">
  <div style="font-size: 40px;">🔄</div>
  <h3>Gira el móvil</h3>
  <p>Usa el zoom para ajustar el tablero.</p>
</div>

<div id="zoom-control">
  <span style="font-size: 10px; font-weight: bold;">ZOOM</span>
  <input type="range" id="zoomRange" min="0.5" max="1.5" step="0.1" value="1">
</div>

<div id="board">
  <div class="top-controls">
    <div id="deck"></div>
    <div id="discard">
      <div style="text-align:center; opacity: 0.4; font-size: 11px; font-weight: 600;">DESCARTES</div>
    </div>
    <div id="filter-container">
      <select id="styleFilter">
        <option value="ALL">Todos los estilos</option>
      </select>
    </div>
  </div>

  <div id="teams-container" style="width:100%; display:flex; flex-direction:column; align-items:center; gap: 20px;">
    <div id="team1" class="column">
      <div class="column-header">
        <div class="team-info">
          <input type="color" class="team-color-picker" value="#38bdf8" onchange="updateTeamColor('team1', this.value)">
          <h2 contenteditable="true" onblur="updateTeamName('team1', this.innerText)">Equipo A</h2>
        </div>
        <button class="btn-delete-team" onclick="deleteTeam('team1')">×</button>
      </div>
      <div class="lane"></div>
    </div>

    <div id="team2" class="column">
      <div class="column-header">
        <div class="team-info">
          <input type="color" class="team-color-picker" value="#38bdf8" onchange="updateTeamColor('team2', this.value)">
          <h2 contenteditable="true" onblur="updateTeamName('team2', this.innerText)">Equipo B</h2>
        </div>
        <button class="btn-delete-team" onclick="deleteTeam('team2')">×</button>
      </div>
      <div class="lane"></div>
    </div>
  </div>

  <button id="add-team-btn" onclick="addTeam()">
    <span>+</span> Añadir Equipo
  </button>
</div>

<div id="card-popup-overlay">
  <div id="card-popup">
    <button class="btn-close-popup" onclick="closePopup()">×</button>
    <div id="popup-content"></div>
    <div class="actions">
      <button id="popup-play" class="btn-card" style="width: 48px; height: 48px; font-size: 20px;">▶</button>
      <button id="popup-stop" class="btn-card" style="width: 48px; height: 48px; font-size: 20px;">■</button>
      <button id="popup-flip" class="btn-card" style="width: 48px; height: 48px; font-size: 20px;">🔄</button>
    </div>
  </div>
</div>

<div id="playing-animation">
  <div id="playing-text">Sonando...</div>
</div>


<audio id="player"></audio>

<script>
  const cardsData = [
    { author: "Celine Dion", year: 1997, title: "My Heart Will Go On", style: "Soundtrack", from: "Titanic" },
    { author: "Randy Newman", year: 1995, title: "You've Got a Friend in Me", style: "Soundtrack", from: "Toy Story" },
    { author: "Elton John", year: 1994, title: "Can You Feel the Love Tonight", style: "Soundtrack", from: "El rey león" },
    { author: "Survivor", year: 1982, title: "Eye of the Tiger", style: "Rock", from: "Rocky III" },
    { author: "Ray Parker Jr.", year: 1984, title: "Ghostbusters", style: "Pop", from: "Los Cazafantasmas" },
    { author: "Ramin Djawadi", year: 2011, title: "Main Title", style: "TV Soundtrack", from: "Juego de tronos" },
    { author: "Howard Shore", year: 2001, title: "The Breaking of the Fellowship", style: "Film Score", from: "El señor de los anillos: La comunidad del anillo" },
    { author: "John Williams", year: 2001, title: "Hedwig's Theme", style: "Soundtrack", from: "Harry Potter y la piedra profesional" },
    { author: "Idina Menzel", year: 2013, title: "Let It Go", style: "Soundtrack", from: "Frozen: El reino del hielo" },
    { author: "Phil Collins", year: 1999, title: "You'll Be in My Heart", style: "Soundtrack", from: "Tarzán" },
    { author: "Phil Collins", year: 1999, title: "Son of Man", style: "Soundtrack", from: "Tarzán" },
    { author: "Donny Osmond", year: 1998, title: "I'll Make a Man Out of You", style: "Soundtrack", from: "Mulán" },
    { author: "Hercules Cast", year: 1997, title: "Go the Distance", style: "Soundtrack", from: "Hércules" },
    { author: "Pocahontas Cast", year: 1995, title: "Colors of the Wind", style: "Soundtrack", from: "Pocahontas" },
    { author: "A Whole New World Cast", year: 1992, title: "A Whole New World", style: "Soundtrack", from: "Aladdín" },
    { author: "Elton John", year: 1994, title: "Hakuna Matata", style: "Soundtrack", from: "El rey león" },
    { author: "John Williams", year: 1993, title: "Theme from Jurassic Park", style: "Soundtrack", from: "Parque Jurásico" },
    { author: "Klaus Badelt", year: 2003, title: "He's a Pirate", style: "Soundtrack", from: "Piratas del Caribe: La maldición de la Perla Negra" },
    { author: "John Williams", year: 1980, title: "The Imperial March", style: "Soundtrack", from: "Star Wars: Episodio V – El Imperio contraataca" },
    { author: "John Williams", year: 1981, title: "Raiders March", style: "Soundtrack", from: "En busca del arca perdida (Indiana Jones)" },
    { author: "Berlin", year: 1986, title: "Take My Breath Away", style: "Pop", from: "Top Gun" },
    { author: "Shrek Cast", year: 2001, title: "All Star", style: "Rock", from: "Shrek" },
    { author: "Louis Prima", year: 1967, title: "I Wan'na Be Like You", style: "Soundtrack", from: "El libro de la selva" },
    { author: "Dick Van Dyke", year: 1964, title: "Supercalifragilisticexpialidocious", style: "Soundtrack", from: "Mary Poppins" },
    { author: "Hans Zimmer", year: 2014, title: "Cornfield Chase", style: "Film Score", from: "Interstellar" },
    { author: "James Horner", year: 1995, title: "For the Love of a Princess", style: "Film Score", from: "Braveheart" },
    { author: "Limahl", year: 1984, title: "The NeverEnding Story", style: "Pop", from: "La historia interminable" },
    { author: "Robert Newton", year: 1950, title: "Fifteen Men", style: "Soundtrack", from: "La isla del tesoro" },
    { author: "Alan Menken", year: 1989, title: "Under the Sea", style: "Soundtrack", from: "La sirenita" },
    { author: "Alan Menken", year: 1991, title: "Beauty and the Beast", style: "Soundtrack", from: "La bella y la bestia" },
    { author: "Brad Fiedel", year: 1984, title: "Main Title", style: "Film Score", from: "Terminator" },
    { author: "Mel Leven", year: 1961, title: "Cruella De Vil", style: "Soundtrack", from: "101 dálmatas" },
    { author: "Hans Zimmer & Lisa Gerrard", year: 2000, title: "Elysium", style: "Film Score", from: "Gladiator" },
    { author: "John Travolta & Olivia Newton-John", year: 1978, title: "You're the One That I Want", style: "Soundtrack", from: "Grease" },
    { author: "Danny Elfman", year: 1993, title: "This Is Halloween", style: "Soundtrack", from: "Pesadilla antes de Navidad" },
    { author: "Bernard Herrmann", year: 1960, title: "Psycho Theme", style: "Film Score", from: "Psicosis" },
    { author: "John Williams", year: 1975, title: "Theme from Jaws", style: "Film Score", from: "Tiburón" },
    { author: "Huey Lewis & The News", year: 1985, title: "The Power of Love", style: "Pop Rock", from: "Regreso al futuro" },
    { author: "John Williams", year: 1982, title: "Flying Theme", style: "Film Score", from: "E.T., el extraterrestre" },
    { author: "Alan Silvestri", year: 1994, title: "Forrest Gump Suite", style: "Film Score", from: "Forrest Gump" },
    { author: "Danny Elfman", year: 1989, title: "Batman Theme", style: "Film Score", from: "Batman" },
    { author: "John Williams", year: 1978, title: "Superman March", style: "Film Score", from: "Superman" },
    { author: "Don Davis", year: 1999, title: "Main Title", style: "Film Score", from: "Matrix" },
    { author: "EJAE, Audrey Nuna & REI AMI", year: 2024, title: "Golden", style: "Soundtrack", from: "K-Pop: Demon Hunters" },
    { author: "James Newton Howard", year: 2014, title: "The Hanging Tree", style: "Soundtrack", from: "Los juegos del hambre: Sinsajo – Parte 1" },
    { author: "Billie Eilish", year: 2023, title: "What Was I Made For?", style: "Soundtrack", from: "Barbie" },
    { author: "Lin-Manuel Miranda", year: 2016, title: "How Far I'll Go", style: "Soundtrack", from: "Vaiana" },
    { author: "Ennio Morricone", year: 1965, title: "The Good, The Bad and The Ugly", style: "Film Score", from: "La muerte tenía un precio" },
    { author: "Roy Orbison", year: 1990, title: "Oh, Pretty Woman", style: "Pop", from: "Pretty Woman" },
    { author: "Judy Garland", year: 1939, title: "Over the Rainbow", style: "Soundtrack", from: "El mago de Oz" },
    { author: "Dick Dale & His Del-Tones", year: 1962, title: "Misirlou", style: "Rock", from: "Pulp Fiction" }
  ];

  let zIndex = 100;
  let stopTimeout = null;
  const player = document.getElementById("player");
  const deck = document.getElementById("deck");
  const discard = document.getElementById("discard");
  const zoomRange = document.getElementById("zoomRange");

  zoomRange.oninput = (e) => {
    const val = e.target.value;
    document.documentElement.style.setProperty('--zoom', val);
    // Forzar redibujado de elementos que dependen del zoom
    layoutDeck(); 
  };

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function init() {
    shuffleArray(cardsData);
    const styleFilter = document.getElementById("styleFilter");
    const styles = [...new Set(cardsData.map(c => c.style))].sort();
    styles.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s; opt.textContent = s;
      styleFilter.appendChild(opt);
    });

    cardsData.forEach((data, i) => createCard(data, i));
    layoutDeck();

    styleFilter.onchange = () => {
      const val = styleFilter.value;
      deck.querySelectorAll(".card").forEach(c => {
        c.style.display = (val === "ALL" || c.dataset.style === val) ? "" : "none";
      });
      layoutDeck();
    };

    // Inicializar colores de los equipos por defecto
    updateTeamColor('team1', '#38bdf8');
    updateTeamColor('team2', '#38bdf8');
  }

  function layoutDeck() {
    const zoom = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--zoom'));
    const visible = [...deck.querySelectorAll(".card")].filter(c => c.style.display !== "none");
    visible.forEach((c, i) => {
      // Desplazamiento sutil que escala con el zoom
      const offset = i * (0.5 * zoom);
      c.style.top = offset + "px";
      c.style.left = offset + "px";
      c.style.zIndex = i;
    });
  }

  function createCard(data, index) {
    const card = document.createElement("div");
    card.className = "card back";
    card.dataset.style = data.style;
    card.innerHTML = `
    <div style="font-size: 0.8em; opacity: 0.6; font-weight: 700; letter-spacing: 1px;">TEMAZOS</div>
    <div class="actions">
      <button class="btn-card play" title="Reproducir">▶</button>
      <button class="btn-card stop" title="Parar">■</button>
      <button class="btn-card flip" title="Revelar">🔄</button>
    </div>
  `;

    card.querySelector(".play").onclick = async (e) => {
      e.stopPropagation();
      playSong(data, e.currentTarget);
    };

    card.querySelector(".stop").onclick = (e) => { 
      e.stopPropagation(); 
      stopSong(card);
    };
    card.querySelector(".flip").onclick = (e) => { e.stopPropagation(); revealCard(card, data); };

    // Doble clic para popup (PC y Móvil)
    let lastTap = 0;
    const handlePopupTrigger = (e) => {
      e.stopPropagation();
      openPopup(card, data);
    };

    card.addEventListener("dblclick", (e) => {
      if (typeof cancelDrag === 'function') {
        cancelDrag();
      }
      handlePopupTrigger(e);
    });

    card.addEventListener("touchstart", (e) => {
      // Si el toque es en un botón, no procesar doble tap para el popup
      if (e.target.tagName === "BUTTON") return;

      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        if (typeof cancelDrag === 'function') {
          cancelDrag();
        }
        handlePopupTrigger(e);
        e.preventDefault(); 
      }
      lastTap = currentTime;
    });

    const cancelDrag = makeDraggable(card);
    deck.appendChild(card);
  }

  function openPopup(card, data) {
    const overlay = document.getElementById("card-popup-overlay");
    const content = document.getElementById("popup-content");
    const isFront = card.classList.contains("front");
    
    // Si la carta ya está girada, nos aseguramos de que no aparezca la animación de "Sonando..."
    if (isFront) {
      stopPlayingAnimation();
    }

    content.innerHTML = "";
    const cardView = document.createElement("div");
    cardView.className = "popup-card-view " + (isFront ? "front-view" : "back-view");
    
    if (isFront) {
      cardView.innerHTML = `
        <div style="font-size: 1.2em; opacity: 0.8; font-weight: 500;">${data.from || data.author}</div>
        <div style="font-size: 3em; font-weight: 800; margin: 10px 0;">${data.year}</div>
        <div style="font-size: 1.4em; font-weight: 600;">${data.title}</div>
      `;
    } else {
      cardView.innerHTML = `
        <div style="font-size: 1.2em; opacity: 0.6; font-weight: 700; letter-spacing: 2px;">TEMAZOS</div>
      `;
    }
    content.appendChild(cardView);

    // Configurar botones del popup
    const pPlay = document.getElementById("popup-play");
    const pStop = document.getElementById("popup-stop");
    const pFlip = document.getElementById("popup-flip");

    pPlay.onclick = () => {
      // Si la carta ya está girada, no activamos la animación de "Sonando..."
      if (!card.classList.contains("front")) {
        startPlayingAnimation();
      }
      playSong(data, pPlay);
    };
    pStop.onclick = () => {
      stopSong(card);
    };
    pFlip.onclick = () => {
      const flipBtn = card.querySelector(".flip");
      if (flipBtn) {
        flipBtn.click();
        // Actualizar vista del popup
        openPopup(card, data);
      }
    };

    overlay.classList.add("active");
  }

  function closePopup() {
    document.getElementById("card-popup-overlay").classList.remove("active");
    stopSong();
  }

  function startPlayingAnimation() {
    const anim = document.getElementById("playing-animation");
    anim.style.display = "flex";
    
    // Generar notas musicales
    for (let i = 0; i < 15; i++) {
      createMusicNote();
    }
  }

  function stopPlayingAnimation() {
    const anim = document.getElementById("playing-animation");
    anim.style.display = "none";
    // Limpiar notas existentes
    anim.querySelectorAll(".music-note").forEach(n => n.remove());
  }

  function createMusicNote() {
    const anim = document.getElementById("playing-animation");
    const note = document.createElement("div");
    note.className = "music-note";
    const notes = ["♪", "♫", "♬", "♩"];
    note.textContent = notes[Math.floor(Math.random() * notes.length)];
    
    // Posición inicial aleatoria cerca del centro
    const startX = window.innerWidth / 2;
    const startY = window.innerHeight / 2;
    note.style.left = startX + "px";
    note.style.top = startY + "px";
    
    // Valores aleatorios para la animación
    const tx = (Math.random() - 0.5) * 800;
    const ty = (Math.random() - 0.5) * 800;
    const tr = (Math.random() - 0.5) * 720;
    
    note.style.setProperty("--tx", `${tx}px`);
    note.style.setProperty("--ty", `${ty}px`);
    note.style.setProperty("--tr", `${tr}deg`);
    
    // Retraso aleatorio
    note.style.animationDelay = Math.random() * 2 + "s";
    
    anim.appendChild(note);
  }

  function revealCard(card, data) {
    player.pause();
    stopPlayingAnimation();
    card.className = "card front";
    card.innerHTML = `
    <div class="card-author">${data.from || data.author}</div>
    <div class="card-year">${data.year}</div>
    <div class="card-title">${data.title}</div>
    <div class="actions" style="margin-top: 5px;">
      <button class="btn-card play" title="Reproducir">▶</button>
      <button class="btn-card stop" title="Parar">■</button>
      <button class="btn-card flip" title="Ocultar">🔄</button>
    </div>
  `;
    // Re-vincular eventos a los nuevos botones
    card.querySelector(".play").onclick = (e) => { e.stopPropagation(); playSong(data, e.currentTarget); };
    card.querySelector(".stop").onclick = (e) => { e.stopPropagation(); stopSong(card); };
    card.querySelector(".flip").onclick = (e) => { e.stopPropagation(); hideCard(card, data); };
    
    // El doble clic y touchstart siguen vinculados al elemento 'card'
  }

  function hideCard(card, data) {
    card.className = "card back";
    card.innerHTML = `
      <div style="font-size: 0.8em; opacity: 0.6; font-weight: 700; letter-spacing: 1px;">TEMAZOS</div>
      <div class="actions">
        <button class="btn-card play" title="Reproducir">▶</button>
        <button class="btn-card stop" title="Parar">■</button>
        <button class="btn-card flip" title="Revelar">🔄</button>
      </div>
    `;
    // Re-vincular eventos
    card.querySelector(".play").onclick = (e) => { e.stopPropagation(); playSong(data, e.currentTarget); };
    card.querySelector(".stop").onclick = (e) => { e.stopPropagation(); stopSong(card); };
    card.querySelector(".flip").onclick = (e) => { e.stopPropagation(); revealCard(card, data); };
    
    // El doble clic y touchstart siguen vinculados al elemento 'card'
  }

  async function playSong(data, btn) {
    if (btn) btn.style.background = "var(--accent)";
    // Si estamos en el popup y la carta ya está revelada, paramos la animación
    const popupOverlay = document.getElementById("card-popup-overlay");
    if (popupOverlay.classList.contains("active")) {
      const content = document.getElementById("popup-content");
      const cardView = content.querySelector(".popup-card-view");
      if (cardView && cardView.classList.contains("front-view")) {
        stopPlayingAnimation();
      }
    }
    
    try {
      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(data.author + " " + data.title)}&entity=song&limit=1`);
      const json = await res.json();
      if(json.results[0]) {
        if(stopTimeout) clearTimeout(stopTimeout);
        player.src = json.results[0].previewUrl;
        player.play();
        stopTimeout = setTimeout(() => {
          player.pause();
          if(btn) btn.style.background = "";
          stopPlayingAnimation();
        }, 25000);
      }
    } catch(e) { console.error("Error audio"); }
  }

  function stopSong(card) {
    player.pause();
    const playBtn = (card && card.querySelector(".play")) || document.getElementById("popup-play");
    if(playBtn) playBtn.style.background = "";
    stopPlayingAnimation();
  }

  function updateTeamColor(teamId, color) {
    const team = document.getElementById(teamId);
    if(team) {
      team.querySelector('h2').style.color = color;
      const lane = team.querySelector('.lane');
      lane.style.borderColor = color;
      // Aplicamos un fondo semi-transparente del mismo color
      lane.style.background = `${color}1A`; // 1A es ~10% de opacidad en hex
    }
  }

  function updateTeamName(teamId, name) {
    console.log(`Nombre de ${teamId} actualizado a: ${name}`);
  }

  function addTeam() {
    const container = document.getElementById("teams-container");
    const id = "team-" + Date.now();
    const count = container.children.length + 1;
    const teamDiv = document.createElement("div");
    teamDiv.id = id;
    teamDiv.className = "column";
    teamDiv.innerHTML = `
      <div class="column-header">
        <div class="team-info">
          <input type="color" class="team-color-picker" value="#38bdf8" onchange="updateTeamColor('${id}', this.value)">
          <h2 contenteditable="true" onblur="updateTeamName('${id}', this.innerText)">Equipo ${String.fromCharCode(64 + count)}</h2>
        </div>
        <button class="btn-delete-team" onclick="deleteTeam('${id}')">×</button>
      </div>
      <div class="lane"></div>
    `;
    container.appendChild(teamDiv);
    // Aplicar color inicial a la fila recién creada
    updateTeamColor(id, '#38bdf8');
  }

  function deleteTeam(id) {
    const team = document.getElementById(id);
    if (team && team.querySelector(".lane").children.length > 0) {
      if (!confirm("¿Eliminar equipo con cartas?")) return;
    }
    team?.remove();
  }

  function makeDraggable(el) {
    let startX, startY, initialClientX, initialClientY;
    let dragging = false;
    const placeholder = document.createElement("div");
    placeholder.className = "placeholder";

    function cancel() {
      if (dragging) {
        onEnd({});
      }
      dragging = false;
    }

    function onStart(e) {
      if (e.target.tagName === "BUTTON" || e.target.tagName === "INPUT" || e.target.isContentEditable) return;
      
      const pos = e.touches ? e.touches[0] : e;
      const rect = el.getBoundingClientRect();

      startX = pos.clientX - rect.left;
      startY = pos.clientY - rect.top;
      initialClientX = pos.clientX;
      initialClientY = pos.clientY;
      dragging = false; 
    }

    function onMove(e) {
      const pos = e.touches ? e.touches[0] : e;
      
      if (!dragging && initialClientX !== undefined) {
        const dist = Math.sqrt(Math.pow(pos.clientX - initialClientX, 2) + Math.pow(pos.clientY - initialClientY, 2));
        if (dist > 7) {
          dragging = true;
          el.style.zIndex = ++zIndex;
          if(el.parentElement.classList.contains("lane")) el.parentElement.insertBefore(placeholder, el);
          document.body.appendChild(el);
        }
      }

      if (!dragging) return;
      
      e.preventDefault();
      el.style.position = "fixed";
      el.style.left = (pos.clientX - startX) + "px";
      el.style.top = (pos.clientY - startY) + "px";

      const lane = getElementUnder(pos.clientX, pos.clientY, ".lane");
      if(lane) {
        lane.appendChild(placeholder);
        const afterElement = Array.from(lane.querySelectorAll(".card:not(.dragging)")).find(c => {
          return pos.clientX < c.getBoundingClientRect().left + c.offsetWidth/2;
        });
        if(afterElement) lane.insertBefore(placeholder, afterElement);
      } else {
        placeholder.remove();
      }
    }

    function onEnd(e) {
      initialClientX = undefined;
      initialClientY = undefined;
      if (!dragging) {
        dragging = false;
        return;
      }
      dragging = false;
      const pos = (e && e.changedTouches) ? e.changedTouches[0] : e;
      const lane = (pos && pos.clientX !== undefined) ? getElementUnder(pos.clientX, pos.clientY, ".lane") : null;
      const disc = (pos && pos.clientX !== undefined) ? getElementUnder(pos.clientX, pos.clientY, "#discard") : null;

      if(lane) {
        lane.insertBefore(el, placeholder);
        el.style.position = "relative";
        el.style.left = "0"; el.style.top = "0";
      } else if (disc) {
        disc.appendChild(el);
        el.style.position = "absolute";
        const count = disc.querySelectorAll(".card").length;
        el.style.left = (count * 1.5) + "px";
        el.style.top = (count * 1.5) + "px";
      } else {
        deck.appendChild(el);
        layoutDeck();
      }
      placeholder.remove();
    }

    function getElementUnder(x, y, selector) {
      const elements = document.elementsFromPoint(x, y);
      return elements.find(el => el.matches(selector));
    }

    el.addEventListener("mousedown", onStart);
    el.addEventListener("touchstart", onStart, {passive: false});
    document.addEventListener("mousemove", onMove);
    document.addEventListener("touchmove", onMove, {passive: false});
    document.addEventListener("mouseup", onEnd);
    document.addEventListener("touchend", onEnd);

    return cancel;
  }

  init();

  // Registro del Service Worker para PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registrado', reg))
        .catch(err => console.error('Error al registrar Service Worker', err));
    });
  }
</script>
