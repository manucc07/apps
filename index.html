<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cronomusic - Inicio</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
  <meta name="theme-color" content="#141E30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cronomusic">

  <style>
    :root {
      --bg-dark: #0f172a;
      --accent: #38bdf8;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-border: rgba(255, 255, 255, 0.1);
      --card-back: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --card-front: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%);
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0, transparent 50%), 
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0, transparent 50%);
      background-attachment: fixed;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 2rem;
      background: linear-gradient(to right, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.05em;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      padding: 40px 20px;
      text-decoration: none;
      color: white;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-8px);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .card:active {
      transform: scale(0.98);
    }

    .card.cronomusic {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(168, 85, 247, 0.1) 100%);
    }

    .card.quien-soy {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.1) 0%, rgba(34, 211, 238, 0.1) 100%);
    }

    .card.hilados {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.1) 0%, rgba(168, 85, 247, 0.1) 100%);
    }

    .card h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .card .description {
      margin-top: 10px;
      font-size: 0.9rem;
      opacity: 0.6;
      font-weight: 400;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2.5rem;
      }
      .card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <h1>Cronomusic</h1>
  
  <div class="container">
    <a href="/cronomusic" class="card cronomusic">
      <div class="icon">🎵</div>
      <h2>Cronomusic</h2>
      <div class="description">Juego de adivinar el año de las canciones</div>
    </a>
    
    <a href="/quien_soy" class="card quien-soy">
      <div class="icon">👤</div>
      <h2>¿Quién soy?</h2>
      <div class="description">Adivina el personaje que se despixela</div>
    </a>

    <a href="/hilados" class="card hilados">
      <div class="icon">🧵</div>
      <h2>Hilados</h2>
      <div class="description">Conecta palabras usando un solo concepto</div>
    </a>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
